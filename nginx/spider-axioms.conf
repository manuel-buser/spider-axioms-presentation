# ============================================================================
#  spider-axioms.conf , nginx integration for the live FD presentation
#
#  Install:
#    1. Copy the `map` + `limit_req_zone` block (top half) to
#         /etc/nginx/conf.d/spider-rate-limit.conf
#       This MUST live in http {} scope, which conf.d/*.conf already is.
#    2. Paste the `location` blocks (bottom half) inside the existing
#         server { listen 443 ssl; server_name manuel-buser.com ...; }
#       block in /etc/nginx/sites-available/manuel-buser.com.
#    3. nginx -t  &&  systemctl reload nginx
#
#  Replace REPLACE_WITH_SECRET below with the token you'll bake into the
#  laptop-side bookmark (https://manuel-buser.com/projects/spider-axioms/?token=...).
# ============================================================================

# ----- conf.d/spider-rate-limit.conf  (http {} scope) -----------------------

# When ?token=SPIDER_SECRET is present the key becomes "" → request bypasses
# the limit_req zone entirely (Manuel's laptop). Otherwise the key is the
# client IP, so audience members hitting the URL get throttled.
map $arg_token $spider_limit_key {
    default                  $binary_remote_addr;
    "REPLACE_WITH_SECRET"    "";
}

# 2 requests per minute per IP, burst of 1 → effectively one race start per
# minute for the public, unlimited for the token holder.
limit_req_zone $spider_limit_key zone=spider_demo:10m rate=2r/m;


# ----- inside sites-available/manuel-buser.com (server :443 {}) -------------

# Redirect bare path → trailing slash so the proxy_pass strips the prefix cleanly
location = /projects/spider-axioms { return 301 /projects/spider-axioms/; }

location /projects/spider-axioms/ {
    # SSE-friendly proxy settings (no buffering, long timeout, HTTP/1.1)
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 600s;

    # Only the FD-spawning endpoint gets rate-limited
    location /projects/spider-axioms/api/run {
        limit_req        zone=spider_demo burst=1 nodelay;
        limit_req_status 429;
        proxy_pass       http://127.0.0.1:8000/api/run$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 600s;
    }

    # Everything else (HTML, CSS, JS, /api/health) , trailing slash on
    # proxy_pass strips the /projects/spider-axioms/ prefix.
    proxy_pass http://127.0.0.1:8000/;
}
